name: Deploy to Beget

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.BEGET_HOST }}
          username: ${{ secrets.BEGET_USER }}
          key: ${{ secrets.BEGET_SSH_KEY }}
          port: ${{ secrets.BEGET_SSH_PORT }}
          command_timeout: "20m"
          script: |
            set -euo pipefail

            # Прод переехал на домен vc-platform.ru (с SSL). Проект живёт ВНУТРИ
            # каталога этого домена — на Beget каждый домен запускается под своим
            # пользователем и не имеет доступа к каталогам другого домена.
            # BEGET_PROJECT_DIR (секрет) может переопределить путь; иначе — новый домен.
            DOMAIN_DIR="$HOME/vc-platform.ru"
            PROJECT_DIR="${{ secrets.BEGET_PROJECT_DIR }}"
            if [ -z "$PROJECT_DIR" ]; then
              PROJECT_DIR="$DOMAIN_DIR/vc_platform"
            fi
            REPO="git@github.com:Willi-Wonkaa/vc_platform.git"
            PY=/usr/bin/python3.10

            # 1) Клонируем репозиторий при первом деплое, дальше — обновляем.
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              git clone "$REPO" "$PROJECT_DIR"
            fi
            cd "$PROJECT_DIR"
            git fetch --all
            git reset --hard origin/main

            # 1b) Passenger-конфиг домена: держим .htaccess в актуальном виде из репо
            #     (AppRoot обязан указывать внутрь этого домена — см. deploy/htaccess.public_html).
            if [ -d "$DOMAIN_DIR/public_html" ] && [ -f deploy/htaccess.public_html ]; then
              cp -f deploy/htaccess.public_html "$DOMAIN_DIR/public_html/.htaccess"
            fi

            # 2) venv (на shared-хостинге создаётся с --copies, симлинки запрещены).
            if [ ! -x ".venv/bin/python" ]; then
              virtualenv --copies -p "$PY" .venv
            fi
            source .venv/bin/activate
            pip install --upgrade pip --quiet
            pip install -r requirements.txt --quiet

            # 3) Миграции и статика.
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            # 4) Перезапуск веб-приложения (Passenger следит за tmp/restart.txt).
            #    После рестарта Passenger подхватит новый код, включая webhook-эндпоинт.
            mkdir -p tmp
            touch tmp/restart.txt

            # 5) Telegram-бот на shared-хостинге Beget работает через WEBHOOK, а не
            #    long polling (постоянный фоновый процесс тут убивается). Обновляем
            #    регистрацию webhook у Telegram на случай смены URL/секрета.
            #    Исходящие уведомления (notifier) крутит cron панели Beget через
            #    `manage.py process_notifications` — см. documentation/deploy.md.
            python manage.py set_webhook || echo "set_webhook: пропущено (проверьте HTTPS/секрет)"
