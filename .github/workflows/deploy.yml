name: Deploy to VPS (Docker)

on:
  workflow_run:
    workflows: ["CI (tests)"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

# Прод переехал на собственный VPS (Docker: db/web/bot/nginx/certbot).
# CI/CD: заходим по SSH → git pull → docker compose up -d --build.
# Миграции применяет entrypoint контейнера web (RUN_MIGRATIONS=1), статику — он же.
#
# Раньше деплой запускался прямо на push в main без единой проверки (testing-audit.md,
# приоритет 1: «CI не запускает тесты вообще»). Теперь деплой ждёт success ci.yml
# на main — красный тест (или незакоммиченная миграция) блокирует выкладку. Ручной
# запуск (workflow_dispatch) по-прежнему доступен в обход этой проверки, если нужно
# задеплоить руками.
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          command_timeout: "20m"
          script: |
            set -euo pipefail

            PROJECT_DIR="${{ secrets.VPS_PROJECT_DIR }}"
            [ -z "$PROJECT_DIR" ] && PROJECT_DIR="$HOME/vc_platform"
            REPO="git@github.com:Willi-Wonkaa/vc_platform.git"

            # Ретрай сетевых операций: DNS на VPS периодически моргает
            # («Temporary failure in name resolution»), из-за чего git clone/fetch
            # падал и валил весь деплой. Повторяем до 5 раз с нарастающей паузой —
            # разовый сбой резолва больше не роняет выкладку.
            retry() {
              local n=1 max=5 delay=6
              until "$@"; do
                if [ $n -ge $max ]; then
                  echo "Команда не удалась после $max попыток: $*" >&2
                  return 1
                fi
                echo "Попытка $n/$max не удалась ($*), повтор через ${delay}s…" >&2
                sleep $delay
                n=$((n+1)); delay=$((delay+6))
              done
            }

            # 1) Обновляем код (репозиторий на VPS клонируется через deploy-key).
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              retry git clone "$REPO" "$PROJECT_DIR"
            fi
            cd "$PROJECT_DIR"
            retry git fetch --all
            git reset --hard origin/main

            # 2) Пересобираем и поднимаем стек. Миграции/collectstatic — в entrypoint web.
            #    --build пересобирает образ при изменении кода/зависимостей.
            docker compose up -d --build

            # 2b) nginx: перечитать конфиг И пересобрать upstream-резолв. При деплое web
            #     пересоздаётся и получает новый IP; nginx конфиг монтируется volume'ом и
            #     сам не перезапускается — поэтому принудительно reload'им (с проверкой
            #     конфига). resolver в nginx.conf держит IP web актуальным в рантайме, а
            #     reload гарантирует, что применится и обновлённый конфиг из репозитория.
            docker compose up -d nginx
            if docker exec vc_platform-nginx-1 nginx -t; then
              docker exec vc_platform-nginx-1 nginx -s reload || docker compose restart nginx
            else
              docker compose restart nginx
            fi

            # 3) Короткая пауза и статус (для наглядности в логах Actions).
            sleep 5
            docker compose ps
