{% extends 'blog/base.html' %}
{% block title %}Подать заявку{% endblock %}
{% block content %}
<h1>Подать заявку на мероприятие</h1>
<div class="card" style="max-width:600px;">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Отправить заявку</button>
    </form>
</div>
{% endblock %}
