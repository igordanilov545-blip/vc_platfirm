{% extends 'blog/base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="card" style="max-width:380px; margin: 3rem auto;">
    <h2>Вход в систему</h2>
    <form method="post">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <label for="id_login">Логин</label>
        {{ form.login }}
        <label for="id_password">Пароль</label>
        {{ form.password }}
        <button type="submit" class="btn" style="width:100%; justify-content:center;">Войти</button>
    </form>
    <div style="margin-top:12px; text-align:center;">
        <a href="{% url 'register' %}" class="btn secondary" style="width:100%; justify-content:center;">Зарегистрироваться</a>
    </div>
</div>
{% endblock %}
