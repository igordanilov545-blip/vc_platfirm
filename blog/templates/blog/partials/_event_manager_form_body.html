{% comment %}
Модальная форма смены ответственного менеджера мероприятия (event_set_manager).
Единственный менеджер выбирается общим пикером волонтёров (data-user-picker, single,
фильтр «manager» — только пользователи с ролью менеджера).
{% endcomment %}
<form method="post" action="{% url 'event_set_manager' event.id %}" data-modal-form>
    {% csrf_token %}
    <div class="field">
        <label>Ответственный менеджер</label>
        <div class="category-chips" data-user-picker data-mode="single" data-field-name="users" data-filter="manager" data-empty-text="Менеджер не выбран" data-linkable>
            <div class="cat-chips-search">
                <input type="text" placeholder="Начните вводить имя или фамилию…" data-chips-search readonly>
            </div>
            <div class="cat-chips-row" data-chips-selected></div>
        </div>
    </div>
    <div class="modal-footer-actions" style="display:flex; justify-content:flex-end; gap:10px; margin-top:1rem;">
        <button type="submit" class="btn">Назначить</button>
    </div>
</form>
