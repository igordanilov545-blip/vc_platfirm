{% load static %}
{% include 'blog/partials/_minecraft_icons.html' %}
<div class="mc-world" aria-hidden="true">
    {% if minecraft_world_light_asset %}<img class="mc-world-image mc-asset-light" src="{% static minecraft_world_light_asset %}" alt="">{% endif %}
    {% if minecraft_world_dark_asset %}<img class="mc-world-image mc-asset-dark" src="{% static minecraft_world_dark_asset %}" alt="">{% endif %}
    <div class="mc-horizon"></div><div class="mc-sun"></div>
</div>
<div class="mc-foreground" aria-hidden="true">
    {% if minecraft_foreground_light_asset %}<img class="mc-asset-light" src="{% static minecraft_foreground_light_asset %}" alt="">{% endif %}
    {% if minecraft_foreground_dark_asset %}<img class="mc-asset-dark" src="{% static minecraft_foreground_dark_asset %}" alt="">{% endif %}
    <div class="mc-pillar"></div><div class="mc-moss"></div><div class="mc-lantern"><i></i></div>
</div>
