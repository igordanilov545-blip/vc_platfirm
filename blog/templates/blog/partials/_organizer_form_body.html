{% comment %}
Тело формы организатора (модалка/страница). Поле «Организации» (M2M) рендерится единым
chip-виджетом выбора «n из m» (data-chip-select, agent-workflow.md §4) — как категории
у мероприятия, а не сырым <select multiple>. Так связать организатора с организациями
удобно прямо здесь (симметрично _organization_form_body.html).
{% endcomment %}
<form method="post" data-modal-form>
    {% csrf_token %}

    {% if form.non_field_errors %}<div class="form-errors">{{ form.non_field_errors }}</div>{% endif %}

    <div class="field-row" style="display:flex; gap:12px;">
        <div class="field" style="flex:1;">{{ form.first_name.label_tag }}{{ form.first_name }}
            {% if form.first_name.errors %}<div class="field-error">{{ form.first_name.errors|striptags }}</div>{% endif %}</div>
        <div class="field" style="flex:1;">{{ form.last_name.label_tag }}{{ form.last_name }}
            {% if form.last_name.errors %}<div class="field-error">{{ form.last_name.errors|striptags }}</div>{% endif %}</div>
    </div>

    <div class="field">
        <label>{{ form.organizations.label }}</label>
        <div class="category-chips" data-chip-select="{{ form.organizations.id_for_label }}" data-chip-empty="Организации не выбраны">
            <div class="cat-chips-row" data-chips-selected></div>
            <div class="cat-chips-available-wrap">
                <div class="cat-chips-available-label">Доступные организации — нажмите, чтобы добавить:</div>
                <div class="cat-chips-row" data-chips-available></div>
                <button type="button" class="btn secondary btn-sm add-ref-btn" data-add-ref="organization" data-target="{{ form.organizations.id_for_label }}" style="margin-top:8px;">＋ Новая организация</button>
            </div>
        </div>
        {{ form.organizations }}
        {% if form.organizations.errors %}<div class="field-error">{{ form.organizations.errors|striptags }}</div>{% endif %}
    </div>

    <div class="field">{{ form.phone.label_tag }}{{ form.phone }}
        {% if form.phone.errors %}<div class="field-error">{{ form.phone.errors|striptags }}</div>{% endif %}</div>
    <div class="field">{{ form.email.label_tag }}{{ form.email }}
        {% if form.email.errors %}<div class="field-error">{{ form.email.errors|striptags }}</div>{% endif %}</div>
    <div class="field">{{ form.telegram_username.label_tag }}{{ form.telegram_username }}
        {% if form.telegram_username.errors %}<div class="field-error">{{ form.telegram_username.errors|striptags }}</div>{% endif %}</div>
    <div class="field">{{ form.VK_username.label_tag }}{{ form.VK_username }}
        {% if form.VK_username.errors %}<div class="field-error">{{ form.VK_username.errors|striptags }}</div>{% endif %}</div>
    <div class="field">{{ form.whatsapp.label_tag }}{{ form.whatsapp }}
        {% if form.whatsapp.errors %}<div class="field-error">{{ form.whatsapp.errors|striptags }}</div>{% endif %}</div>
    <div class="field">{{ form.comments.label_tag }}{{ form.comments }}
        {% if form.comments.errors %}<div class="field-error">{{ form.comments.errors|striptags }}</div>{% endif %}</div>

    <div class="modal-footer-actions" style="display:flex; justify-content:flex-end; gap:10px; margin-top:1rem;">
        <button type="submit" class="btn">{{ submit_label|default:'Сохранить' }}</button>
    </div>
</form>
