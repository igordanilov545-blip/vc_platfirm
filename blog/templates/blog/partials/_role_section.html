<div class="card">
    <h3>{{ title }}</h3>
    <p style="color:var(--text-secondary); font-size:0.85rem;">{{ hint }}</p>

    {% if section.users_count == 0 %}
        <p style="color:var(--text-secondary);">Подходящих пользователей нет.</p>
    {% else %}
    <form method="post" data-role-form data-confirm-verb="{{ confirm_verb }}">
        {% csrf_token %}
        <input type="hidden" name="action" value="{{ action }}">

        <div class="field">
            <label>Поиск ({{ section.users_count }} доступно)</label>
            <div class="category-chips" data-chip-select data-select-remote="users" data-field-name="{{ action }}-users" data-empty-text="{{ empty_text }}" data-filter="{{ picker_filter }}"{% if section.preselect_json %} data-preselect="{{ section.preselect_json }}"{% endif %}>
                <div class="cat-chips-search">
                    <input type="text" placeholder="Начните вводить имя или фамилию…" data-chips-search readonly>
                </div>
                <div class="cat-chips-row" data-chips-selected></div>
            </div>
        </div>

        <div class="field" style="max-width:220px;">
            <label>{{ section.captcha_question }} =</label>
            <input type="number" name="captcha_answer" required>
        </div>

        <button type="submit" class="btn {{ submit_class }}">{{ submit_label }}</button>
    </form>
    {% endif %}
</div>
