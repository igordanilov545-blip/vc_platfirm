<span class="fap-help" tabindex="0" role="img" aria-label="Как связать таблицу. Подробная инструкция — на странице настройки таблицы." title="1. Загрузите XLSX на Google Диск и откройте его в Google Таблицах. Для файла Excel выберите «Файл → Сохранить как Google Таблицы».&#10;2. Нужная вкладка должна называться «Смены».&#10;3. В «Настройках доступа» выберите «Все, у кого есть ссылка → Читатель».&#10;4. Скопируйте адрес таблицы из браузера.&#10;5. Нажмите «Связать таблицу», вставьте ссылку и сохраните.&#10;6. Для отправки изменений подключите JSON-ключ через «Настроить Google» и выдайте указанному там аккаунту доступ редактора. Затем нажмите «Отправить в Google», чтобы сохранить служебные ID. Дальше используйте кнопки обмена.">?</span>
