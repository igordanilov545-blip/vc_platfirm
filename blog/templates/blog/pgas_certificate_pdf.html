<meta charset="utf-8">
<title>Справка ВЦ для ПГАС — {{ user.full_name }}</title>
<style>

    body {
        font-family: 'Times New Roman', 'Liberation Serif', serif;
        color: #1a1a1a; font-size: 13pt; line-height: 1.5; margin: 0;
    }
    .doc-header {
        display: flex; align-items: center; gap: 14px;
        border-bottom: 2px solid #0050b3; padding-bottom: 12px; margin-bottom: 18px;
    }
    .doc-header .hse-logo {
        font-weight: 700; font-size: 20pt; color: #0050b3; letter-spacing: 0.02em;
    }
    .doc-header .hse-sub { font-size: 10pt; color: #444; }
    /* Тело справки: сохраняем переводы строк из шаблона как есть. */

    .sign-slot {
        margin-top: 42px; display: flex; justify-content: space-between;
        align-items: flex-end;
    }
    .sign-slot .line { border-top: 1px solid #1a1a1a; width: 220px; text-align: center;
        font-size: 10pt; color: #555; padding-top: 4px; }
</style>

<div class="doc-header">
    <span class="hse-logo">ВЫСШАЯ ШКОЛА ЭКОНОМИКИ</span>
