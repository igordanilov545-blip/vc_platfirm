<!DOCTYPE html>
<html>
<head>
    <title>Блог</title>
</head>
<body>
    <h1>Посты</h1>
    <a href="{% url 'post_create' %}">Добавить пост</a>

    {% for post in posts %}
        <div>
            <h2>{{ post.title }}</h2>
            <p>{{ post.content }}</p>
            <small>{{ post.created_at }}</small>
            <form method="post" action="{% url 'post_delete' post.id %}">
                {% csrf_token %}
                <button type="submit">Удалить</button>
            </form>
        </div>
    {% endfor %}
</body>
</html>
