{% extends 'blog/base.html' %}
{% load static %}
{% block title %}Настройки{% endblock %}
{% block content %}
<div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;">
    <h1>Настройки</h1>
    <div class="event-toolbar"><a href="{% url 'role_invitation_list' %}" class="btn secondary">Ссылки приглашения</a><a href="{% url 'legacy_base_upload' %}" class="btn secondary">Загрузка базы</a></div>
    <button type="button" class="companion-launch" id="companion-launch" style="max-width:320px;">
        <img src="{% static 'blog/companion/goose_0.jpg' %}" alt="Компаньон">
        <span class="companion-launch-text">
            <span class="companion-launch-title">Гайд по настройкам</span>
            <span class="companion-launch-desc">Гусь проведёт по разделам за руку</span>
        </span>
    </button>
</div>

<div class="card settings-hub-card">
    <div class="report-types settings-tabs" id="settings-tabs">
        {% for tab in tabs %}{% if tab.key != 'pgas_template' %}
        <button type="button" class="report-type settings-tab {% if tab.key == active_tab %}active{% endif %}"
                data-tab="{{ tab.key }}" data-url="{{ tab.url }}">
            <span class="rt-icon">{{ tab.icon }}</span>
            <span class="rt-title">{{ tab.title }}</span>
            <span class="rt-desc">{{ tab.desc }}</span>
        </button>
        {% endif %}{% endfor %}
    </div>
</div>

<div class="settings-panel" id="settings-panel" data-active-url="{{ active_url }}">
    <p style="color:var(--text-secondary);">Загрузка…</p>
</div>

<script>
    // Хаб настроек: клик по кнопке хедера подгружает свою панель в #settings-panel
    // через AJAX (сервер отдаёт partial по X-Requested-With) и пишет активную вкладку
    // в URL. Единый список поведений таблиц/пикеров/модалок из base.html навешивается
    // на свежий контент через initSettingsPanel (все init*-функции идемпотентны по
    // data-*Init-флагам, поэтому повторный вызов на всей панели безопасен).
    // Скрипт блока content выполняется РАНЬШЕ основного скрипта base.html (тот в конце
    // body), где объявлены init*-функции общих компонентов. Поэтому откладываем запуск
    // до DOMContentLoaded — к этому моменту base.html уже определил initSortableTables и
    // др. (те же соображения, что у CalendarUtils в <head>, hot_fix_1 §B).
    document.addEventListener('DOMContentLoaded', function () {
        var panel = document.getElementById('settings-panel');
        var tabsRow = document.getElementById('settings-tabs');
        if (!panel || !tabsRow) return;

        function initSettingsPanel(root) {
            // Переиспользуем инициализаторы общих компонентов (base.html) для только что
            // вставленной разметки — таблицы, пикеры волонтёров, счётчики символов, формы.
            if (typeof initSortableTables === 'function') initSortableTables(root);
            if (typeof initHideableColumns === 'function') initHideableColumns(root);
            if (typeof initTableFilter === 'function') initTableFilter(root);
            if (typeof initCategoryChips === 'function') initCategoryChips(root);
            if (typeof initCharCounters === 'function') initCharCounters(root);
            if (typeof bindRoleForms === 'function') bindRoleForms(root);
            if (typeof bindConfirmForms === 'function') bindConfirmForms(root);
        }

        function loadPanel(url, push) {
            panel.innerHTML = '<p style="color:var(--text-secondary);">Загрузка…</p>';
            return fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
                .then(function (r) { return r.text(); })
                .then(function (html) {
                    panel.innerHTML = html;
                    initSettingsPanel(panel);
                    panel.scrollIntoView({ block: 'nearest' });
                })
                .catch(function () {
                    panel.innerHTML = '<div class="card"><p>Не удалось загрузить раздел. Обновите страницу.</p></div>';
                });
        }

        function activateTab(btn, push) {
            tabsRow.querySelectorAll('.settings-tab').forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
            var url = btn.getAttribute('data-url');
            var tabKey = btn.getAttribute('data-tab');
            if (push) {
                history.pushState({ tab: tabKey }, '', '?tab=' + tabKey);
            }
            return loadPanel(url, push);
        }

        // Внешний хук для компаньон-тура: программно открыть вкладку по ключу и
        // дождаться, пока её панель догрузится (тур подсвечивает вкладку синхронно, а
        // текст объясняет её содержимое — панель сверху при этом реально переключается).
        window.settingsOpenTab = function (tabKey) {
            var btn = tabsRow.querySelector('.settings-tab[data-tab="' + tabKey + '"]');
            if (!btn) return Promise.resolve();
            if (btn.classList.contains('active')) return Promise.resolve();
            return activateTab(btn, true) || Promise.resolve();
        };

        tabsRow.addEventListener('click', function (event) {
            var btn = event.target.closest('.settings-tab');
            if (!btn) return;
            activateTab(btn, true);
        });

        // Кнопка «назад»/«вперёд» браузера — переключаем активную вкладку без нового
        // pushState (иначе история задвоится).
        window.addEventListener('popstate', function () {
            var params = new URLSearchParams(window.location.search);
            var tabKey = params.get('tab');
            var btn = tabsRow.querySelector('.settings-tab[data-tab="' + tabKey + '"]')
                || tabsRow.querySelector('.settings-tab.active')
                || tabsRow.querySelector('.settings-tab');
            if (btn) activateTab(btn, false);
        });

        // Первичная загрузка активной панели (активная вкладка уже отмечена сервером).
        var initial = tabsRow.querySelectorAll('.settings-tab.active').length
            ? tabsRow.querySelector('.settings-tab.active') : tabsRow.querySelector('.settings-tab');
        if (initial) {
            initial.classList.add('active');
            loadPanel(initial.getAttribute('data-url'), false);
        }
    });
</script>

<script>
    // companion.js подключён глобально в base.html — здесь только сценарий тура настроек.
    // Сценарий компаньон-тура по настройкам: гусь ведёт по вкладкам-разделам за руку.
    // Каждый шаг подсвечивает кнопку-вкладку и одновременно переключает панель сверху
    // (settingsOpenTab), а текст объясняет, что в этом разделе. Тексты — из
    // documentation/companion-guide/manager.md. Фото компаньона закреплены по слотам
    // goose_0..3 (сейчас все указывают на один файл — заменить позже точечно).
    document.addEventListener('DOMContentLoaded', function () {
        var GOOSE = {
            0: '{% static "blog/companion/goose_0.jpg" %}',
            1: '{% static "blog/companion/goose_1.jpg" %}',
            2: '{% static "blog/companion/goose_2.jpg" %}',
            3: '{% static "blog/companion/goose_3.jpg" %}',
        };
        function tab(key) { return '.settings-tab[data-tab="' + key + '"]'; }

        var STEPS = [
            { target: null, placement: 'center', photo: GOOSE[0],
              title: 'Заглянем в настройки',
              text: 'Тут живёт всё «редко, но метко»: справочники, требования, сезоны, роли, константы, шаблон справки. Тыкать сюда будешь нечасто — так что пройдёмся разок вместе.' },
            { target: tab('locations'), placement: 'bottom', photo: GOOSE[0], tabKey: 'locations',
              title: '📍 Локации',
              text: 'Площадки, где проходят мероприятия. Добавляешь адрес один раз — дальше просто выбираешь его при создании меро.' },
            { target: tab('organizations'), placement: 'bottom', photo: GOOSE[1], tabKey: 'organizations',
              title: '🏢 Организации',
              text: 'Партнёры и заказчики мероприятий. К организации привязываются организаторы — контактные лица.' },
            { target: tab('organizers'), placement: 'bottom', photo: GOOSE[1], tabKey: 'organizers',
              title: '🤝 Организаторы',
              text: 'Контактные лица организаций. Их можно завести прямо из формы меро через «＋», не выходя из неё.' },
            { target: tab('requirements'), placement: 'bottom', photo: GOOSE[2], tabKey: 'requirements',
              title: '✅ Требования',
              text: 'Условия допуска волонтёров. По умолчанию все всем соответствуют — тут ведёшь только белый список исключений: кто на меро с этим требованием уходит в резерв.' },
            { target: tab('seasons'), placement: 'bottom', photo: GOOSE[2], tabKey: 'seasons',
              title: '🗓️ Сезоны',
              text: 'Периоды учёта. Закрытие сезона обнуляет сезонную статистику и переносит часть чарна — критичное действие, поэтому под подтверждением.' },
            { target: tab('team_leaders'), placement: 'bottom', photo: GOOSE[3], tabKey: 'team_leaders',
              title: '⭐ Тим-лидеры',
              text: 'Назначаешь и снимаешь роль ТЛ парой действий. Дальше заявки и явку на своих меро ведут они — делегируй.' },
            { target: tab('managers'), placement: 'bottom', photo: GOOSE[3], tabKey: 'managers',
              title: '🛡️ Менеджеры',
              text: 'Выдаёшь роль менеджера — роль тим-лидера прилагается автоматически. Помнить про два назначения не нужно.' },
            { target: tab('constants'), placement: 'bottom', photo: GOOSE[0], tabKey: 'constants',
              title: '🔢 Константы',
              text: 'Пороги churn, часы отмены и прочие коэффициенты. На реально опасных правках попросят капчу с пояснением — трение ровно там, где спасает от случайной ошибки.' },
        ];

        var OUTRO = {
            photo: GOOSE[0],
            title: 'Ну вот и всё по настройкам 🎉',
            text: 'Теперь ты знаешь, где что лежит. Заглядывать сюда будешь нечасто — тем спокойнее. Захочешь повторить — кнопка «Гайд по настройкам» сбоку всегда на месте.',
        };
        var INTERRUPTED = {
            photo: GOOSE[0],
            title: 'Понял, не мешаю',
            text: 'Вопросов зеро. Если что — я сижу в настройках, надо будет — я тут.',
        };

        function startTour() {
            CompanionTour.start(STEPS, {
                storageKey: 'companion_settings_seen',
                outro: OUTRO,
                interrupted: INTERRUPTED,
                onStepEnter: function (step) {
                    // Переключаем панель сверху на раздел шага (если у шага есть вкладка).
                    if (step.tabKey && typeof window.settingsOpenTab === 'function') {
                        return window.settingsOpenTab(step.tabKey);
                    }
                    return null;
                },
            });
        }

        var launch = document.getElementById('companion-launch');
        if (launch) launch.addEventListener('click', startTour);

        // Автозапуск при первом заходе в настройки (один раз — дальше только по кнопке).
        var seen = false;
        try { seen = localStorage.getItem('companion_settings_seen') === '1'; } catch (e) {}
        if (!seen) setTimeout(startTour, 600);
    });
</script>
{% endblock %}
