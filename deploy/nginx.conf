# Reverse-proxy для VPS. HTTP-блок всегда обслуживает ACME-челлендж и (до выпуска
# сертификата) само приложение; после выпуска — редиректит на HTTPS. HTTPS-блок
# ссылается на сертификаты Let's Encrypt в общем томе с certbot.
#
# Чтобы nginx не падал на старте, когда сертификата ещё нет, deploy/init_letsencrypt.sh
# сначала кладёт временный self-signed сертификат по тому же пути, затем меняет его на
# настоящий от Let's Encrypt (стандартный bootstrap-приём certbot).

# ВАЖНО: НЕ используем `upstream ... { server web:8000; }` — nginx резолвит имя
# ОДИН РАЗ при старте и кэширует IP. После пересоздания контейнера web (каждый
# `docker compose up --build` при деплое) web получает новый IP, а nginx продолжает
# стучаться на старый → «connection refused» → 502 Bad Gateway.
# Решение: резолвим через встроенный DNS Docker (127.0.0.11) в РАНТАЙМЕ, задавая
# адрес через переменную — тогда nginx резолвит `web` на каждый запрос и всегда
# видит актуальный IP. valid=10s — короткий кэш, чтобы быстро подхватывать смену IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name vc-platform.ru www.vc-platform.ru;

    # ACME http-01 челлендж (certbot webroot) — должен отвечать всегда, до и после SSL.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # После выпуска сертификата — весь трафик на HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name vc-platform.ru www.vc-platform.ru;

    ssl_certificate     /etc/letsencrypt/live/vc-platform.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vc-platform.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25m;   # загрузка Excel-импорта и т.п.

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        # Имя web в переменной → nginx резолвит его в рантайме через resolver выше
        # (иначе кэширует IP при старте и ловит 502 после пересоздания web).
        set $upstream_web web;
        proxy_pass http://$upstream_web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django узнаёт про HTTPS через этот заголовок (SECURE_PROXY_SSL_HEADER).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
