<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бот — Гость · Волонтёрский центр</title>
  <link rel="stylesheet" href="bot-tree.css">
</head>
<body>
  <div class="cjm-app">
    <div class="cjm-topbar">
      <div>
        <h1>Бот — Гость</h1>
        <div class="sub"></div>
      </div>
      <div class="cjm-legend">
        <span class="chip"><span class="sw act"></span><b>действие</b></span>
        <span class="chip"><span class="sw warn"></span><b>предупреждение</b></span>
        <span class="chip"><span class="sw proact"></span><b>бот сам</b></span>
      </div>
      <nav class="cjm-nav">
        <a href="index.html">Обзор</a>
        <a href="guest.html" class="active">Гость</a>
        <a href="volunteer.html">Волонтёр</a>
        <a href="team-leader.html">Тим-лидер</a>
        <a href="manager.html">Менеджер</a>
      </nav>
    </div>
    <div class="cjm-stage-wrap">
      <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="cjm-hint">👆 Кликни по узлу — увидишь ответ бота, кнопки и ветки. Значок ✅/🔶 на карточке — статус согласования блока. Тяни — панорама · колесо — зум.</div>
      <div class="cjm-controls">
        <button id="zoom-in" title="Приблизить">+</button>
        <button id="zoom-out" title="Отдалить">−</button>
        <button id="zoom-fit" class="wide" title="Вписать в экран">Вписать</button>
      </div>
    </div>
  </div>

  <script>
  window.BOT_DATA = {
    title: 'Бот — Гость',
    subtitle: 'Первое касание · просмотр меро · авторизация через Telegram / регистрация',
    nodes: [
      { id: 'start', kind: 'root', code: '/start', title: 'Первое касание', status: 'review',
        bot: '👋 Привет! Я бот Волонтёрского центра.\n\nЯ помогаю удобно откликаться на мероприятия, следить за своими часами и заявками — без таблиц и переписок, всё в одном месте.\n\nЧто доступно:\n📅 /events — смотреть мероприятия\n🔑 /login — войти, если ты уже оставлял(а) заявки раньше\n📝 /register — зарегистрироваться\n📊 /stats — статистика · 🔔 /subscribe — уведомления · ℹ️ /help — справка\n\nПо всем вопросам — контакты центра в /help.',
        menu: ['📅 Мероприятия', '🔑 Войти через Telegram', '📝 Зарегистрироваться'],
        note: 'Команды в тексте кликабельны (флеш-команды): /events, /login, /register и т.д. — не только кнопками.' },

      { id: 'help', kind: 'leaf', code: '/help', title: 'Справка гостя', status: 'review',
        bot: 'ℹ️ Я — бот Волонтёрского центра. Нужен, чтобы ты в пару тапов откликался(ась) на мероприятия, видел(а) свои часы и статусы заявок, получал(а) анонсы новых наборов — без ручной рутины.\n\nДоступные команды:\n/events — открытые мероприятия\n/login — войти, если уже оставлял(а) заявки\n/register — зарегистрироваться\n\nПосле входа: подача заявок, /myapps, /stats, /subscribe.\n\n☎ Контакты центра: …' },

      { id: 'events', kind: 'stage', code: '/events', title: 'Открытые мероприятия', status: 'review',
        bot: '📅 Открытые мероприятия:\n\n1. «Помощь приюту "Лапки"»\n   📍 Парк Горького · 📆 12.07.2026\n   📋 Требования: 18+, любовь к животным\n   [🔎 Подробнее]\n\n2. «Забег "Спорт для всех"»\n   📍 Лужники · 📆 14.07.2026\n   📋 Требования: —\n   [🔎 Подробнее]\n\n⬇️ Внизу — кнопки по числу меро:\n[Откликнуться на «Лапки»] [Откликнуться на «Забег»]',
        menu: ['Откликнуться на «…» (по кнопке на каждое меро)', '🔎 Подробнее'],
        note: 'Одно сообщение = список меро + внизу кнопки «Откликнуться на <название>». Показываем что/где/когда + требования (позже — «плюшки»). «Подробнее» ведёт на пост, если он есть.' },

      { id: 'events_empty', kind: 'leaf', code: '/events ∅', title: 'Нет открытых меро', status: 'approved',
        bot: '📅 Сейчас нет мероприятий с открытым набором.\nКак только появятся — сразу сообщим (уведомления включены по умолчанию).' },

      { id: 'need_auth', kind: 'warn', code: 'G·auth', title: 'Не авторизован → вход/регистрация', status: 'review',
        bot: 'Чтобы откликнуться, нужно войти. Ты уже оставлял(а) заявки раньше?\n\n[🔑 Войти через Telegram]   [📝 Зарегистрироваться]',
        menu: ['🔑 Войти через Telegram', '📝 Зарегистрироваться'],
        note: 'Бот запоминает event_id, на который гость хотел откликнуться (pending), и вернёт к нему после входа.' },

      // Авторизация через Telegram — сопоставление по username из прошлых заявок
      { id: 'login', kind: 'stage', code: '/login', title: 'Вход через Telegram', status: 'review',
        bot: '🔑 Проверяю по твоему Telegram… Кажется, мы тебя знаем:\n\n👤 Иван Петров, @ivan_p\n\nЭто ты?\n\n[✅ Да, это я]   [Нет, это не я]',
        menu: ['✅ Да, это я', 'Нет, это не я'],
        note: 'Смотрим в БД, использовался ли этот username в прошлых заявках; если да — предлагаем войти в найденный аккаунт с его опытом.' },
      { id: 'login_ok', kind: 'stage', code: '✓', title: 'Вошёл в свой аккаунт', status: 'review',
        bot: '✅ С возвращением, Иван! Ты вошёл — весь твой прежний опыт (часы, меро) на месте.',
        note: 'Пользователь становится авторизованным волонтёром; подтягиваем прежний профиль и историю.' },
      { id: 'login_notme', kind: 'act', code: 'G·new', title: 'Это не я → регистрация', status: 'review',
        bot: 'Ок, тогда заведём новый аккаунт. Регистрируемся 👇',
        note: 'Регистрируем новый аккаунт; помечаем возможную коллизию (два разных пользователя с одним Telegram) для менеджера.' },

      { id: 'reg_name', kind: 'stage', code: '/register', title: 'Регистрация — имя', status: 'review',
        bot: '📝 Регистрация\n\nКак тебя зовут? (имя и фамилия)' },
      { id: 'reg_phone', kind: 'stage', code: 'FSM', title: 'Регистрация — телефон', status: 'review',
        bot: 'Отлично, {Имя}! Оставишь номер телефона? Связаться с тобой мы сможем и через Telegram, но телефон бывает нужен тим-лидеру на площадке.',
        menu: ['📱 Поделиться контактом', 'Пропустить'],
        note: 'Telegram у нас уже есть — по нему и связываемся. Телефон запрашиваем, но необязателен.' },

      { id: 'reg_done', kind: 'stage', code: 'registered', title: 'Регистрация завершена', status: 'review',
        bot: '✅ Спасибо за регистрацию! Ты авторизован(а).\n\nДоступно: /events, /myapps, /stats, 🔔 /subscribe, /help.',
        menu: ['📅 Мероприятия', '📝 Мои заявки', '📊 Статистика', '🔔 Подписка'] },

      { id: 'reg_pending', kind: 'proact', code: 'G→apply', title: 'Довести отклик до конца', status: 'review',
        bot: 'Кстати, ты хотел(а) откликнуться на «Помощь приюту "Лапки"». Завершить заявку сейчас?\n\n[✅ Да, к выбору смен]   [Не сейчас]',
        menu: ['✅ Да, к выбору смен', 'Не сейчас'],
        note: 'Бот помнил pending event_id и после входа/регистрации предлагает довести отклик.' },

      // Выбор смен — общий узел для гостя (после входа) и волонтёра
      { id: 'shifts', kind: 'stage', code: 'shifts', title: 'Выбор смен', status: 'review',
        bot: '🗓 «Помощь приюту "Лапки"» — выбери смены:\n\n[✅ Выбрать все смены]\n[Смена 12.07 · 10:00–14:00]\n[Смена 13.07 · 10:00–14:00]\n\n[Подать заявку]',
        menu: ['✅ Выбрать все смены', 'Смена …', 'Подать заявку'],
        note: 'Все смены → сразу заявка на все, регистрация на меро закончена. Конкретная смена → она в пул, кнопка меняется на «Отменить смену», появляется «Зарегистрироваться».' },
      { id: 'shifts_none', kind: 'warn', code: '⚠', title: 'Не выбрана смена', status: 'review',
        bot: 'Сначала выбери смену 🙂\n\n(Старое сообщение с кнопками убираем и присылаем его заново с актуальными кнопками.)' },
      { id: 'apply_ok', kind: 'leaf', code: '✓', title: 'Заявка принята', status: 'review',
        bot: '✅ Твоя заявка на «Помощь приюту "Лапки"» принята на рассмотрение. Бот пришлёт ответ сюда.',
        note: 'ТЛ этого меро и активные менеджеры получают уведомление о новой заявке.' },

      { id: 'volunteer', kind: 'leaf', code: '→ Волонтёр', title: 'Теперь волонтёр', status: 'approved',
        bot: 'Дальше — дерево «Волонтёр»: мои заявки, статистика, подписка, оценка после участия.' },
    ],
    edges: [
      { from: 'start', to: 'help', action: '/help', kind: 'act' },
      { from: 'start', to: 'events', action: '📅 Мероприятия', kind: 'act' },
      { from: 'start', to: 'login', action: '🔑 Войти через Telegram', kind: 'act' },
      { from: 'start', to: 'reg_name', action: '📝 Зарегистрироваться', kind: 'act' },
      { from: 'help', to: 'events', action: '/events', kind: 'act' },
      { from: 'help', to: 'login', action: '/login', kind: 'act' },
      { from: 'help', to: 'reg_name', action: '/register', kind: 'act' },

      { from: 'events', to: 'events_empty', action: 'нет набора', kind: 'warn' },
      { from: 'events', to: 'need_auth', action: 'Откликнуться (гость)', kind: 'warn',
        note: 'Гость не авторизован — предлагаем войти или зарегистрироваться, запомнив меро.' },

      { from: 'need_auth', to: 'login', action: '🔑 Войти через Telegram', kind: 'act' },
      { from: 'need_auth', to: 'reg_name', action: '📝 Зарегистрироваться', kind: 'act' },

      { from: 'login', to: 'login_ok', action: '✅ Да, это я', kind: 'act' },
      { from: 'login', to: 'login_notme', action: 'Нет, это не я', kind: 'act' },
      { from: 'login_notme', to: 'reg_name', action: 'регистрируем новый аккаунт', kind: 'act' },

      { from: 'reg_name', to: 'reg_phone', action: 'ввёл имя и фамилию', kind: 'act' },
      { from: 'reg_phone', to: 'reg_pending', action: 'телефон / пропустил + был отложенный отклик', kind: 'proact' },
      { from: 'reg_phone', to: 'reg_done', action: 'телефон / пропустил (без отклика)', kind: 'act' },
      { from: 'login_ok', to: 'reg_pending', action: 'был отложенный отклик', kind: 'proact' },
      { from: 'login_ok', to: 'volunteer', action: 'без отложенного отклика', kind: 'act' },

      { from: 'reg_pending', to: 'shifts', action: '✅ Да, к выбору смен', kind: 'act' },
      { from: 'reg_pending', to: 'reg_done', action: 'Не сейчас', kind: 'act' },
      { from: 'reg_done', to: 'volunteer', action: 'полное меню', kind: 'act' },

      { from: 'shifts', to: 'apply_ok', action: '✅ Выбрать все смены', kind: 'act' },
      { from: 'shifts', to: 'apply_ok', action: 'выбрал смену → Зарегистрироваться', kind: 'act' },
      { from: 'shifts', to: 'shifts_none', action: 'Подать заявку без выбора смены', kind: 'warn' },
      { from: 'apply_ok', to: 'volunteer', action: 'дальше как волонтёр', kind: 'act' },
    ],
  };
  </script>
  <script src="bot-tree.js"></script>
</body>
</html>
