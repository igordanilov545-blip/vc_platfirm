<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бот — Менеджер · Волонтёрский центр</title>
  <link rel="stylesheet" href="bot-tree.css">
</head>
<body>
  <div class="cjm-app">
    <div class="cjm-topbar">
      <div>
        <h1>Бот — Менеджер</h1>
        <div class="sub"></div>
      </div>
      <div class="cjm-legend">
        <span class="chip"><span class="sw act"></span><b>действие</b></span>
        <span class="chip"><span class="sw warn"></span><b>предупреждение</b></span>
        <span class="chip"><span class="sw proact"></span><b>бот сам</b></span>
      </div>
      <nav class="cjm-nav">
        <a href="index.html">Обзор</a>
        <a href="guest.html">Гость</a>
        <a href="volunteer.html">Волонтёр</a>
        <a href="team-leader.html">Тим-лидер</a>
        <a href="manager.html" class="active">Менеджер</a>
      </nav>
    </div>
    <div class="cjm-stage-wrap">
      <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="cjm-hint">👆 Кликни по узлу — ответ бота, кнопки и ветки. Значок ✅/🔶 — статус согласования блока. Менеджер видит всё меню волонтёра и ТЛ; здесь — доп. функции.</div>
      <div class="cjm-controls">
        <button id="zoom-in" title="Приблизить">+</button>
        <button id="zoom-out" title="Отдалить">−</button>
        <button id="zoom-fit" class="wide" title="Вписать в экран">Вписать</button>
      </div>
    </div>
  </div>

  <script>
  window.BOT_DATA = {
    title: 'Бот — Менеджер',
    subtitle: 'Все заявки · текущие меро с набором · публикация меро · рассылка',
    nodes: [
      { id: 'menu', kind: 'root', code: 'меню менеджера', title: 'Меню менеджера', status: 'review',
        bot: 'Приветствую, {Имя}! Вы — менеджер Волонтёрского центра.\n\nВам доступно:\n📋 все заявки\n📅 текущие мероприятия (с набором)\n📢 опубликовать мероприятие\n📨 сделать рассылку\n🔔 уведомления о заявках\n…и весь функционал ТЛ и волонтёра.',
        menu: ['📋 Все заявки', '📅 Текущие мероприятия', '📢 Опубликовать меро', '📨 Сделать рассылку', '🔔 Заявки: уведомления'] },

      // Все заявки
      { id: 'allapps', kind: 'stage', code: 'M·apps', title: 'Все заявки', status: 'review',
        bot: '📋 Все заявки по всем мероприятиям:\n\n• «Лапки» — Иван Петров — 🕓 На рассмотрении\n• «Забег» — Мария Смирнова — ✅ Одобрена\n• «Субботник» — Пётр Сидоров — 💤 Резерв\n\n(Можно открыть и обработать любую — как ТЛ, но на любом меро.)',
        menu: ['Открыть заявку'] },
      { id: 'process_any', kind: 'stage', code: 'M·proc', title: 'Обработка заявки (любое меро)', status: 'review',
        bot: '📥 Заявка от Пётр Сидоров · ✈ @petya · «Субботник» · смены: 18.07\n\n[✅ Одобрить]  [💤 В резерв]',
        menu: ['✅ Одобрить', '💤 В резерв'],
        note: 'После обработки менеджером уходит оповещение: «Заявка на <меро> обработана менеджером <имя>, статус: …».' },
      { id: 'process_done', kind: 'leaf', code: '✓', title: 'Обработано + оповещение', status: 'review',
        bot: '✅ Готово. Оповещение: «Заявка на "Субботник" обработана менеджером {Имя}. Статус: одобрена». Волонтёр тоже уведомлён.' },

      // Текущие мероприятия с набором
      { id: 'events', kind: 'stage', code: 'M·events', title: 'Текущие мероприятия', status: 'review',
        bot: '📅 Текущие мероприятия:\n\n«Помощь приюту "Лапки"» · 12.07.2026\n🗓 Смены: 12.07 — нужно 6, набрано 4 (67%) · 13.07 — нужно 4, набрано 4 (100%)\n👤 Организатор: Анна Кузнецова · 🏢 Приют "Лапки"\n✈ @anna_priut · ☎ +7 903 555-11-22',
        note: 'Как у гостя/волонтёра, но добавлено: сколько на какую смену нужно и % набора, а также организатор и организация.' },

      // Публикация
      { id: 'publish', kind: 'stage', code: 'M·publish', title: 'Опубликовать меро', status: 'review',
        bot: '📢 Сформированы, но не опубликованы:\n\n1. «Городской субботник» — 18.07.2026   [Опубликовать]\n2. «Эко-акция» — 20.07.2026            [Опубликовать]\n\n(Это меро, созданные на сайте, но где не нажата кнопка «Опубликовать».)',
        menu: ['Опубликовать (под каждым)'] },
      { id: 'published', kind: 'stage', code: '✓', title: 'Меро опубликовано', status: 'review',
        bot: '✅ «Городской субботник» опубликовано — набор открыт.\n\nСделать рассылку по этому мероприятию?\n\n[📨 Да, разослать]   [Нет]',
        menu: ['📨 Да, разослать', 'Нет'],
        note: 'В любом случае (да/нет) менеджер возвращается в базовое меню.' },

      // Рассылка отдельной кнопкой
      { id: 'broadcast_menu', kind: 'stage', code: 'M·bc', title: 'Сделать рассылку', status: 'review',
        bot: '📨 Активные мероприятия с открытым набором:\n\n1. «Городской субботник» · 18.07 — рассылка ещё не делалась   [Разослать]\n2. «Помощь приюту "Лапки"» · 12.07 — последняя рассылка 10.07   [Разослать]',
        menu: ['Разослать (под каждым)'],
        note: 'Показываем, когда по меро в последний раз делали рассылку.' },
      { id: 'broadcast_done', kind: 'proact', code: '✓', title: 'Рассылка отправлена', status: 'review',
        bot: '📨 Рассылка по «Городской субботник» отправлена всем подписанным волонтёрам.',
        note: 'Рассылка = анонс всем подписанным волонтёрам (notify_new_events). Повторная — с текстом «Продолжаем набирать волонтёров…».' },
      { id: 'back_menu', kind: 'leaf', code: '↩', title: 'Назад в меню', status: 'review',
        bot: 'Возврат в базовое меню менеджера.' },

      // appnotify
      { id: 'appnotify', kind: 'stage', code: '/appnotify', title: 'Уведомления о заявках', status: 'review',
        bot: '🔔 Тумблер уведомлений о новых заявках по всем меро.',
        menu: ['🔔 Заявки: уведомления'] },
      { id: 'appnotify_on', kind: 'leaf', code: 'on', title: 'Вкл', status: 'review',
        bot: '🔔 Уведомления о новых заявках включены.' },
      { id: 'appnotify_off', kind: 'leaf', code: 'off', title: 'Выкл', status: 'review',
        bot: '🔕 Уведомления о новых заявках выключены. Заявки остаются в списке всех заявок.' },
      { id: 'app_push', kind: 'proact', code: 'M·push', title: 'Новая заявка (проактивно)', status: 'review',
        bot: '📥 Новая заявка на «Городской субботник»\nПётр Сидоров · ✈ @petya\n[✅ Одобрить]  [💤 В резерв]',
        note: 'Любая новая заявка по любому меро уходит активным менеджерам с включённым тумблером.' },
    ],
    edges: [
      { from: 'menu', to: 'allapps', action: '📋 Все заявки', kind: 'act' },
      { from: 'menu', to: 'events', action: '📅 Текущие мероприятия', kind: 'act' },
      { from: 'menu', to: 'publish', action: '📢 Опубликовать меро', kind: 'act' },
      { from: 'menu', to: 'broadcast_menu', action: '📨 Сделать рассылку', kind: 'act' },
      { from: 'menu', to: 'appnotify', action: '🔔 /appnotify', kind: 'act' },
      { from: 'menu', to: 'app_push', action: 'пришла новая заявка', kind: 'proact' },

      { from: 'allapps', to: 'process_any', action: 'Открыть заявку', kind: 'act' },
      { from: 'process_any', to: 'process_done', action: '✅ Одобрить / 💤 Резерв', kind: 'act' },
      { from: 'app_push', to: 'process_any', action: '✅ Одобрить / 💤 Резерв', kind: 'act' },

      { from: 'publish', to: 'published', action: 'Опубликовать', kind: 'act' },
      { from: 'published', to: 'broadcast_done', action: '📨 Да, разослать', kind: 'act' },
      { from: 'published', to: 'back_menu', action: 'Нет (в базовое меню)', kind: 'act' },

      { from: 'broadcast_menu', to: 'broadcast_done', action: 'Разослать', kind: 'act' },

      { from: 'appnotify', to: 'appnotify_on', action: 'включить', kind: 'act' },
      { from: 'appnotify', to: 'appnotify_off', action: 'выключить', kind: 'act' },
    ],
  };
  </script>
  <script src="bot-tree.js"></script>
</body>
</html>
