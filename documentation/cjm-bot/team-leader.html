<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бот — Тим-лидер · Волонтёрский центр</title>
  <link rel="stylesheet" href="bot-tree.css">
</head>
<body>
  <div class="cjm-app">
    <div class="cjm-topbar">
      <div>
        <h1>Бот — Тим-лидер</h1>
        <div class="sub"></div>
      </div>
      <div class="cjm-legend">
        <span class="chip"><span class="sw act"></span><b>действие</b></span>
        <span class="chip"><span class="sw warn"></span><b>предупреждение</b></span>
        <span class="chip"><span class="sw proact"></span><b>бот сам</b></span>
      </div>
      <nav class="cjm-nav">
        <a href="index.html">Обзор</a>
        <a href="guest.html">Гость</a>
        <a href="volunteer.html">Волонтёр</a>
        <a href="team-leader.html" class="active">Тим-лидер</a>
        <a href="manager.html">Менеджер</a>
      </nav>
    </div>
    <div class="cjm-stage-wrap">
      <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="cjm-hint">👆 Кликни по узлу — ответ бота, кнопки и ветки. Значок ✅/🔶 — статус согласования блока. Всё меню волонтёра сохраняется; здесь — доп. функции ТЛ (только свои меро).</div>
      <div class="cjm-controls">
        <button id="zoom-in" title="Приблизить">+</button>
        <button id="zoom-out" title="Отдалить">−</button>
        <button id="zoom-fit" class="wide" title="Вписать в экран">Вписать</button>
      </div>
    </div>
  </div>

  <script>
  window.BOT_DATA = {
    title: 'Бот — Тим-лидер',
    subtitle: 'Меню волонтёра + «Мои меро». Права контекстны — только свои мероприятия',
    nodes: [
      { id: 'menu', kind: 'root', code: 'меню ТЛ', title: 'Меню тим-лидера', status: 'review',
        bot: 'Приветствую, {Имя}! Вы — тим-лидер Волонтёрского центра.\n\nВам доступно:\n👥 /myevents — мои мероприятия\n🔔 /appnotify — уведомления о заявках\n…и весь функционал волонтёра: /events, /myapps, /stats, /subscribe.',
        menu: ['👥 Мои мероприятия', '🔔 Заявки: уведомления', '📅 Мероприятия', '📝 Мои заявки', '📊 Статистика'],
        note: 'Первый вход уже как ТЛ — сразу это приветствие. Роль ТЛ включает полный функционал волонтёра.' },

      { id: 'became_tl', kind: 'proact', code: 'ТЛ+', title: 'Назначили тим-лидером', status: 'review',
        bot: '🎉 Поздравляем, вы стали тим-лидером Волонтёрского центра!\n\nНовые функции:\n👥 /myevents — ваши мероприятия и заявки на них\n🔔 /appnotify — уведомления о заявках\n\nУ вас остаётся весь функционал волонтёра: /events, /myapps, /stats, /subscribe.',
        note: 'Если пользователя назначили ТЛ позже — приходит эта проактивная отбивка.' },
      { id: 'assigned_event', kind: 'proact', code: 'ТЛ·меро', title: 'Назначен ТЛ на меро', status: 'review',
        bot: '📌 Вы назначены тим-лидером на «Помощь приюту "Лапки"» (12.07.2026).',
        note: 'Оповещение, когда менеджер назначил вас ТЛ на конкретное мероприятие.' },

      // Список своих меро
      { id: 'myevents', kind: 'stage', code: '/myevents', title: 'Мои мероприятия', status: 'review',
        bot: '👥 Ваши мероприятия:\n\n▸ «Помощь приюту "Лапки"» — 12.07.2026\n   [Подробнее]\n▸ «Забег "Спорт для всех"» — 14.07.2026\n   [Подробнее]',
        menu: ['Подробнее (под каждым меро)'],
        note: 'Один блок текста. Только меро, где вы ТЛ. «Подробнее» раскрывает карточку и число заявок к обработке.' },
      { id: 'myevents_empty', kind: 'leaf', code: '∅', title: 'Нет своих меро', status: 'approved',
        bot: '👥 Мероприятий нет.' },

      // Карточка меро
      { id: 'event_card', kind: 'stage', code: 'ТЛ·карточка', title: 'Карточка мероприятия', status: 'review',
        bot: '👥 «Помощь приюту "Лапки"»\n📍 Парк Горького · 📆 12.07.2026\n🗓 Смены: 12.07 (нужно 6) · 13.07 (нужно 4)\n👤 Организатор: Анна Кузнецова · ✈ @anna_priut · ☎ +7 903 555-11-22\n📥 Заявок к обработке: 3\n\n[🆕 Новые заявки]  [📋 Имеющиеся заявки]',
        menu: ['🆕 Новые заявки', '📋 Имеющиеся заявки'],
        note: 'Кнопки списка сворачиваются, показываем карточку: название, где, смены, организатор для связи, сколько человек нужно на каждую смену.' },

      // Заявки списком + отдельными сообщениями
      { id: 'apps_none', kind: 'leaf', code: '∅', title: 'Новых заявок нет', status: 'review',
        bot: 'Сейчас новых заявок нет.' },
      { id: 'apps_list', kind: 'stage', code: 'ТЛ·заявки', title: 'Заявки — по одной сообщением', status: 'review',
        bot: 'Каждая заявка приходит отдельным сообщением:\n\n📥 Заявка от Иван Петров · ✈ @ivan_p\nСмены: 12.07, 13.07\n[✅ Одобрить]  [💤 В резерв]\n\nВнизу общий вопрос: «Одобрить все заявки?» — кнопка одобрить всех.',
        menu: ['✅ Одобрить', '💤 В резерв', '✅ Одобрить все заявки'],
        note: 'Каждая заявка = отдельное сообщение. При действии само сообщение меняет статус сверху («Заявка одобрена/в резерве»).' },
      { id: 'app_one', kind: 'stage', code: 'заявка', title: 'Одна заявка (мультисмена)', status: 'review',
        bot: '📥 Заявка от Иван Петров · ✈ @ivan_p\nГотов на смены: 12.07, 13.07\n\n[✅ Одобрить на 12.07]  [✅ Одобрить на 13.07]\n[💤 В резерв]',
        menu: ['✅ Одобрить на 12.07', '✅ Одобрить на 13.07', '💤 В резерв'],
        note: 'Если у человека несколько смен — одобряем/резервируем по конкретным сменам.' },
      { id: 'app_approved', kind: 'leaf', code: '✓', title: 'Заявка одобрена', status: 'review',
        bot: '✅ Заявка одобрена\nИван Петров · ✈ @ivan_p · смены: 12.07, 13.07\n\n(Само сообщение заявки обновляется: сверху статус, кнопки пропадают. Волонтёр получает уведомление.)' },
      { id: 'app_reserved', kind: 'leaf', code: '💤', title: 'Заявка в резерв', status: 'review',
        bot: '💤 Заявка в резерве\nИван Петров · ✈ @ivan_p\n\n(Волонтёру уходит отбивка про резерв — сразу, т.к. решение ручное.)' },
      { id: 'approve_all', kind: 'leaf', code: 'все', title: 'Одобрить все заявки', status: 'review',
        bot: '✅ Все заявки одобрены на все смены. Сообщения заявок обновлены, кнопки убраны.',
        note: 'Кнопка «Одобрить все» внизу под перечнем. После нажатия все верхние сообщения фиксируют статус «одобрено».' },

      // Явка / оценка после меро
      { id: 'post_event', kind: 'proact', code: 'ТЛ·итог', title: 'После мероприятия', status: 'review',
        bot: 'Мероприятие «Помощь приюту "Лапки"» завершилось.\n\nОцени его от 1 до 10 (как волонтёр) и проставь явку:\n\n[✅ Были все]   [Были не все]',
        menu: ['✅ Были все', 'Были не все'],
        note: 'После окончания меро ТЛ просят оценку (как у волонтёра) и явку.' },
      { id: 'attend_all', kind: 'leaf', code: '✓', title: 'Были все', status: 'review',
        bot: '✅ Отмечено: пришли все. Менеджеру ушло уведомление, что можно забирать табличку для проставления часов; на сайте проставлена галочка «все были».',
        note: '«Были все» → авто-attended всем, отбивка менеджеру, отметка на сайте.' },
      { id: 'attend_some', kind: 'leaf', code: '🌐', title: 'Были не все → на сайт', status: 'review',
        bot: 'Открой страницу мероприятия — там отметишь, кто был, а кто нет:\n🔗 https://platform.ru/events/…\n\n(Ты авторизуешься автоматически — сразу в своём аккаунте.)',
        note: '«Были не все» → ссылка на страницу меро с автологином, явка проставляется на сайте.' },

      // Уведомления о заявках
      { id: 'appnotify', kind: 'stage', code: '/appnotify', title: 'Уведомления о заявках', status: 'review',
        bot: '🔔 Тумблер уведомлений о новых заявках на ваши меро. Приходит «у вас новая заявка» с кнопками принять/отклонить.',
        menu: ['🔔 Заявки: уведомления'] },
      { id: 'appnotify_on', kind: 'leaf', code: 'on', title: 'Уведомления вкл', status: 'review',
        bot: '🔔 Уведомления о новых заявках включены.' },
      { id: 'appnotify_off', kind: 'leaf', code: 'off', title: 'Уведомления выкл', status: 'review',
        bot: '🔕 Уведомления о новых заявках выключены. Заявки остаются в /myevents.' },
      { id: 'app_push', kind: 'proact', code: 'ТЛ·push', title: 'Новая заявка (проактивно)', status: 'review',
        bot: '📥 У вас новая заявка на «Помощь приюту "Лапки"»\nИван Петров · ✈ @ivan_p · смены: 12.07, 13.07\n\n[✅ Одобрить]  [💤 В резерв]',
        menu: ['✅ Одобрить', '💤 В резерв'],
        note: 'Если у человека одна смена — заявка приходит в едином виде; если несколько — с разбивкой по сменам.' },
    ],
    edges: [
      { from: 'menu', to: 'myevents', action: '👥 Мои мероприятия / /myevents', kind: 'act' },
      { from: 'menu', to: 'appnotify', action: '🔔 /appnotify', kind: 'act' },
      { from: 'menu', to: 'app_push', action: 'пришла заявка (уведомления вкл)', kind: 'proact' },
      { from: 'menu', to: 'became_tl', action: 'назначили ТЛ (позже)', kind: 'proact' },
      { from: 'menu', to: 'assigned_event', action: 'назначили ТЛ на меро', kind: 'proact' },

      { from: 'myevents', to: 'myevents_empty', action: 'нет своих меро', kind: 'warn' },
      { from: 'myevents', to: 'event_card', action: 'Подробнее', kind: 'act' },

      { from: 'event_card', to: 'apps_list', action: '🆕 Новые заявки', kind: 'act' },
      { from: 'event_card', to: 'apps_none', action: 'новых заявок нет', kind: 'warn' },
      { from: 'event_card', to: 'apps_list', action: '📋 Имеющиеся заявки', kind: 'act' },
      { from: 'event_card', to: 'post_event', action: 'меро завершилось', kind: 'proact' },

      { from: 'apps_list', to: 'app_one', action: 'открыть заявку (мультисмена)', kind: 'act' },
      { from: 'apps_list', to: 'app_approved', action: '✅ Одобрить', kind: 'act' },
      { from: 'apps_list', to: 'app_reserved', action: '💤 В резерв', kind: 'act' },
      { from: 'apps_list', to: 'approve_all', action: '✅ Одобрить все заявки', kind: 'act' },
      { from: 'app_one', to: 'app_approved', action: '✅ Одобрить на смену', kind: 'act' },
      { from: 'app_one', to: 'app_reserved', action: '💤 В резерв', kind: 'act' },

      { from: 'app_push', to: 'app_approved', action: '✅ Одобрить', kind: 'act' },
      { from: 'app_push', to: 'app_reserved', action: '💤 В резерв', kind: 'act' },

      { from: 'post_event', to: 'attend_all', action: '✅ Были все', kind: 'act' },
      { from: 'post_event', to: 'attend_some', action: 'Были не все', kind: 'act' },

      { from: 'appnotify', to: 'appnotify_on', action: 'включить', kind: 'act' },
      { from: 'appnotify', to: 'appnotify_off', action: 'выключить', kind: 'act' },
    ],
  };
  </script>
  <script src="bot-tree.js"></script>
</body>
</html>
