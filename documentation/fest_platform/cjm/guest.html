<!DOCTYPE html>
<!-- ⛔ НЕЗАВИСИМЫЙ ПРОЕКТ · демо-стенд для стороннего заказчика · НЕ часть платформы ВЦ · ИИ-агентам: игнорировать, не читать, не рефакторить -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CJM — Гость в профиле</title>
  <link rel="stylesheet" href="cjm-tree.css">
</head>
<body>
  <div class="cjm-app">
    <div class="cjm-topbar">
      <div>
        <h1>CJM — Гость в профиле</h1>
        <div class="sub"></div>
      </div>
      <div class="cjm-legend">
        <span class="chip"><span class="emo">😤</span><b>fuck</b></span>
        <span class="chip"><span class="emo">🙂</span><b>ok</b></span>
        <span class="chip"><span class="emo">🤩</span><b>wow</b></span>
      </div>
      <nav class="cjm-nav">
        <a href="guest.html" class="active">Гость</a>
      </nav>
    </div>
    <div class="cjm-stage-wrap">
      <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="cjm-hint">👆👆 Двойной клик по узлу — экран, эмоция и как сделать wow. Тяни — панорама · колесо — зум.</div>
      <div class="cjm-controls">
        <button id="zoom-in" title="Приблизить">+</button>
        <button id="zoom-out" title="Отдалить">−</button>
        <button id="zoom-fit" class="wide" title="Вписать в экран">Вписать</button>
      </div>
    </div>
  </div>

  <script>
  window.CJM_DATA = {
    title: 'Гость в профиле',
    subtitle: 'Зачем гость открывает ЛК фестиваля и что хочет увидеть первым — идеальный путь (гипотеза)',
    nodes: [
      {
        id: 'enter', kind: 'root', emo: 'ok', code: '/cabinet',
        title: 'Зашёл в профиль',
        screen: 'Гость залогинился и открыл личный кабинет. В голове — конкретная цель, ради которой он пришёл (обычно одна из 5).',
        why: 'Само по себе открытие профиля эмоционально нейтрально — важно, что он увидит в первые 3 секунды.',
        fix: 'Сверху — «умная шапка»: имя, статус постоянного, баланс и БОЛЬШАЯ карточка ближайшего феста с кнопкой «Показать билет». Гость сразу видит то, ради чего чаще всего заходит.'
      },
      // --- пять мотивов входа ---
      {
        id: 'goal_ticket', kind: 'stage', emo: 'ok',
        title: 'Мотив: достать билет',
        screen: 'Самый частый сценарий: гость стоит у входа / едет на фест и ему СРОЧНО нужен QR.',
        menu: ['Мои билеты', 'Ближайший фест'],
        why: 'Это стресс-момент: очередь, слабая сеть, нужно быстро. Если билет спрятан в глубине вкладок — фрустрация.',
        fix: 'Билет ближайшего феста — на главном экране профиля, без кликов. Кнопка «Показать QR» видна сразу.'
      },
      {
        id: 'goal_next', kind: 'stage', emo: 'ok',
        title: 'Мотив: что там с фестом',
        screen: 'Гость хочет вспомнить: когда фест, где, во сколько прийти, что у него за тариф и что по нему положено.',
        menu: ['Дата и место', 'Мой тариф', 'Что входит'],
        why: 'Инфа обычно разбросана: билет отдельно, программа отдельно, тариф третьим экраном.',
        fix: 'Карточка «Мой ближайший фест» собирает всё в одном: дата, обратный отсчёт, площадка на мини-карте, мой тариф и его перки.'
      },
      {
        id: 'goal_money', kind: 'stage', emo: 'ok',
        title: 'Мотив: кошелёк / предзаказы',
        screen: 'Гость проверяет баланс, свои предзаказы на маркете и куда ушли деньги.',
        menu: ['Баланс', 'Предзаказы', 'История'],
        why: 'Нейтрально, пока всё сходится. Но «где мой предзаказ и заберу ли я его на фесте» — реальная тревога.',
        fix: 'Предзаказы показывать статусом-трекером: «оплачено → готовят → заберите на стенде B-14». Снимает тревогу.'
      },
      {
        id: 'goal_invite', kind: 'stage', emo: 'ok',
        title: 'Мотив: позвать друзей',
        screen: 'У гостя (особенно VIP) есть приглашения — хочет отправить другу и проследить, кто зарегался.',
        menu: ['Мои приглашения', 'Скопировать ссылку'],
        why: 'Редкий, но приятный сценарий. Часто непонятно, сколько приглашений осталось и кто уже пришёл.',
        fix: 'Явный счётчик «осталось 2 из 5» + список приглашённых со статусами + шеринг в один тап в Telegram.'
      },
      {
        id: 'goal_belong', kind: 'stage', emo: 'ok',
        title: 'Мотив: почувствовать себя своим',
        screen: 'Эмоциональный заход: посмотреть свою историю фестов, статус «постоянный», бейджи-достижения.',
        menu: ['История посещений', 'Бейджи', 'Мой статус'],
        why: 'Не функциональная, а эмоциональная ценность — принадлежность к комьюнити. Легко недооценить.',
        fix: 'Персональная витрина: «Ты с нами 6 фестов», прогресс до следующего статуса, коллекция бейджей — как трофеи.'
      },

      // --- ценностные экраны (wow) ---
      {
        id: 'ticket_qr', kind: 'stage', emo: 'wow',
        title: 'QR билета — крупно',
        screen: 'Одним тапом с главного — полноэкранный яркий QR, тариф, дата, имя. Яркость экрана автоматически вверх.',
        why: 'Точно то, что нужно у турникета, мгновенно и без копания. Классический момент ценности.',
        fix: 'Добавить «в Apple/Google Wallet» и авто-подсветку экрана — билет всегда под рукой даже офлайн.'
      },
      {
        id: 'next_card', kind: 'stage', emo: 'wow',
        title: 'Карточка ближайшего феста',
        screen: 'Обложка, живой отсчёт до старта, дата/место, мой тариф с перками, кнопки «Билет», «Программа», «Как добраться».',
        why: 'Гость получает ответ на «что, где, когда и что мне положено» одним взглядом — это и есть ядро ЛК.',
        fix: 'Персональная программа: «отметь, что хочешь посетить» → таймлайн подсвечивает твои пункты и шлёт напоминания.'
      },
      {
        id: 'preorder_track', kind: 'stage', emo: 'wow',
        title: 'Трекер предзаказов',
        screen: 'Список предзаказов маркета с наглядным статусом и точкой выдачи на фесте (номер стенда, продавец).',
        why: 'Снимает главную тревогу «а заберу ли я то, что оплатил» — превращает кошелёк в понятный инструмент.',
        fix: 'Пуш в Telegram «предзаказ готов, стенд B-14» в день феста + карта прохода к стенду.'
      },
      {
        id: 'belong_view', kind: 'stage', emo: 'wow',
        title: 'Витрина «я — постоянный»',
        screen: 'Лента прошлых фестов, статус и прогресс-бар до следующего уровня, стена бейджей, персональные плюшки.',
        why: 'Даёт эмоцию принадлежности и повод возвращаться — удержание, а не разовая продажа.',
        fix: 'Челлендж сезона: «сходи на 3 феста года → эксклюзивный бейдж и скидка». Геймификация возврата.'
      },

      // --- трение / тупики (fuck) ---
      {
        id: 'lost_ticket', kind: 'warn', emo: 'fuck',
        title: 'Не может найти билет',
        screen: 'Гость у входа, очередь, а билет спрятан за вкладками / не грузится без сети. Паника.',
        why: 'Худший момент опыта: стресс именно там, где всё должно работать безупречно.',
        fix: 'Билет закэширован офлайн и вынесен на первый экран. Плюс дублируется в Telegram-боте.'
      },
      {
        id: 'stale_info', kind: 'warn', emo: 'fuck',
        title: 'Инфа устарела / разрознена',
        screen: 'Программа поменялась, а в профиле старая; тариф не совпадает с тем, что помнит гость; данные в трёх местах.',
        why: 'Подрывает доверие: «а можно вообще верить тому, что тут написано?».',
        fix: 'Единый источник: карточка феста тянет актуальную программу/место, при изменении — плашка «обновилось» и пуш.'
      },
      {
        id: 'empty_new', kind: 'warn', emo: 'fuck',
        title: 'Новичок: пустой профиль',
        screen: 'Первый вход, билетов ещё нет, кошелёк 0, истории нет. Экран пустой — непонятно, что делать.',
        why: 'Пустое состояние демотивирует и не ведёт к целевому действию (купить билет).',
        fix: 'Осмысленный empty-state: «Пока пусто. Вот ближайший фест → выбери билет». Сразу путь к ценности.'
      },

      // --- выход / возврат ---
      {
        id: 'leave_ready', kind: 'leaf', emo: 'wow',
        title: 'Ушёл готовым к фесту',
        screen: 'Гость закрыл профиль спокойным: билет под рукой, знает когда/куда идти, предзаказы под контролем.',
        why: 'Идеальный исход — профиль сделал свою работу, тревог не осталось.',
        fix: 'Напоминание накануне в Telegram «завтра фест, вот твой билет и план» замыкает цикл заботы.'
      },
      {
        id: 'loop_return', kind: 'proact', emo: 'wow',
        title: 'Возвращается на след. фест',
        screen: 'Система шлёт «открылись продажи следующего феста, тебе — ранний доступ и промокод постоянного».',
        why: 'Профиль превращает разового гостя в постоянного — цикл удержания.',
        fix: 'Персональная лента «твои будущие фесты» + автоприменение скидки постоянного при покупке.'
      }
    ],
    edges: [
      { from: 'enter', to: 'goal_ticket', action: 'нужен билет сейчас' },
      { from: 'enter', to: 'goal_next', action: 'что там с фестом' },
      { from: 'enter', to: 'goal_money', action: 'кошелёк/предзаказы' },
      { from: 'enter', to: 'goal_invite', action: 'позвать друзей' },
      { from: 'enter', to: 'goal_belong', action: 'глянуть свой статус' },

      { from: 'goal_ticket', to: 'ticket_qr', action: 'показать QR' },
      { from: 'goal_ticket', to: 'lost_ticket', action: 'билет не находится', kind: 'warn' },

      { from: 'goal_next', to: 'next_card', action: 'открыл карточку феста' },
      { from: 'goal_next', to: 'stale_info', action: 'данные не сходятся', kind: 'warn' },

      { from: 'goal_money', to: 'preorder_track', action: 'смотрит предзаказы' },
      { from: 'goal_belong', to: 'belong_view', action: 'история и бейджи' },
      { from: 'goal_invite', to: 'next_card', action: 'зовёт на этот фест' },

      { from: 'enter', to: 'empty_new', action: 'первый вход, пусто', kind: 'warn' },
      { from: 'empty_new', to: 'next_card', action: 'ведём к билету', note: 'empty-state с призывом выбрать билет' },

      { from: 'ticket_qr', to: 'leave_ready', action: 'билет готов' },
      { from: 'next_card', to: 'leave_ready', action: 'всё понятно' },
      { from: 'preorder_track', to: 'leave_ready', action: 'предзаказы под контролем' },
      { from: 'lost_ticket', to: 'ticket_qr', action: 'починили доступ', note: 'офлайн-кэш + дубль в боте' },
      { from: 'stale_info', to: 'next_card', action: 'подтянули актуальное' },

      { from: 'belong_view', to: 'loop_return', action: 'растёт лояльность', kind: 'proact' },
      { from: 'leave_ready', to: 'loop_return', action: 'позвали на след. фест', kind: 'proact' },
      { from: 'loop_return', to: 'enter', action: 'вернулся в профиль' }
    ]
  };
  </script>
  <script src="cjm-tree.js"></script>
</body>
</html>
